---
name: Release images

# Build the R2S and RV2 FreeBSD images for a release tag and attach them to
# that tag's GitHub release. Both images share one FreeBSD world build, so
# they are made in one job. Builds run on a private self-hosted Fedora 44
# runner; no Ubuntu-hosted runners are used.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)build
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'DaveWK/freebsd-img-maker'
    runs-on: [self-hosted, linux, x64, fedora44]
    timeout-minutes: 720
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Require a Fedora 44 runner
        run: |
          . /etc/os-release
          test "$ID" = fedora
          test "$VERSION_ID" = 44
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1; Node 24
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
          fetch-depth: 1
      - name: Check build tools
        run: |
          for t in clang ld.lld llvm-ar llvm-nm llvm-objcopy python3 git openssl xz \
              curl gcc make cpp; do
            command -v "$t" >/dev/null || { echo "missing tool on the runner: $t" >&2; exit 1; }
          done
      - name: Build FreeBSD
        run: make freebsd
      - name: Build the R2S image
        run: make r2s
      - name: Build the RV2 image
        run: make rv2
      - name: Name the release assets
        run: |
          mkdir -p dist
          for board in r2s rv2; do
            (cd "out/$board" && sha256sum -c SHA256SUMS)
            for f in out/"$board"/*; do
              name=$(basename "$f")
              case "$name" in
              SHA256SUMS) ;;
              *.img) xz -T0 -9 -c "$f" > "dist/$name.xz" ;;
              freebsd-*) cp "$f" "dist/$name" ;;
              *) cp "$f" "dist/$board-$name" ;;
              esac
            done
          done
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1; Node 24
        with:
          name: images
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    if: github.repository == 'DaveWK/freebsd-img-maker'
    runs-on: [self-hosted, linux, x64, fedora44]
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Require a Fedora 44 runner
        run: |
          . /etc/os-release
          test "$ID" = fedora
          test "$VERSION_ID" = 44
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1; Node 24
        with:
          name: images
          path: dist/
      - name: Verify and attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          {
            printf 'FreeBSD images for %s, booted by oreboot bt0 -> OpenSBI -> EDK2 (no U-Boot).\n\n' "$TAG"
            printf -- '- freebsd-rv2.img.xz: complete microSD image for the OrangePi RV2\n'
            printf -- '- freebsd-r2s.img.xz: eMMC user-area image for the OrangePi R2S;\n'
            printf -- '  r2s-boot0.bin goes to eMMC boot0 and r2s-next.img to eMMC boot1\n\n'
            printf 'Login: root / Riscv123 (console and SSH). No SSH keys are included.\n'
            printf 'See README.md for install steps. Checksums in SHA256SUMS.\n'
          } > ../notes.txt
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" -- * --clobber
          else
            gh release create "$TAG" -- * --verify-tag --title "$TAG" --notes-file ../notes.txt
          fi
