# Maximum tested MTU-1500 endpoint performance, without application overrides.
# Initial TCP buffers match the validated 512-KiB send / 1-MiB receive setup.
# Applications can still explicitly request different socket buffer sizes.
net.inet.tcp.sendspace=524288
net.inet.tcp.recvspace=1048576
net.inet.tcp.sendbuf_auto=0
net.inet.tcp.recvbuf_auto=0
