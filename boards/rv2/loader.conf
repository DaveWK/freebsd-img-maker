beastie_disable="YES"
loader_color="NO"
autoboot_delay="10"
k1dtb_load="YES"
k1dtb_name="/boot/dtb/k1-orangepi-rv2.dtb"
k1dtb_type="dtb"
vm.pmap.superpages_enabled="0"
# Maximum tested MTU-1500 performance on the SMTE data port.
hw.smte.0.dma_translate="1"
hw.smte.1.dma_translate="0"
hw.smte.0.sw_lro="1"
hw.smte.0.tx_pack="1"
hw.smte.0.tx_queue_len="1024"
# The RV2's NVMe (Realtek RTS5765) reports MAXCMD 4; honouring it caps the
# drive at 32 outstanding commands and halves random I/O.
hw.nvme.honor_maxcmd="0"
# Every PCIe payload above 2 GiB bounces, and nvme(4) fails a request when
# the 4104-page bounce pool runs out. 12 trackers x 8 queues x 33 pages, plus
# the admin queue, always fit.
hw.nvme.io_trackers="12"
