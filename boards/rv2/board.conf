# OrangePi RV2: SpacemiT K1, 4 GiB, microSD, eMMC socket, M.2 NVMe, SPI NOR.
BOARD_NAME="OrangePi RV2"
KERNCONF=RV2PROD
DTB=k1-orangepi-rv2.dtb
# The image is a whole microSD card: the BootROM descriptor and both bt0
# copies before the first partition, the OpenSBI+EDK2 FIT in GPT "boot1".
MEDIA=sd
BOOT_CHAIN=rv2
ESP_LABEL=rv2efi
ESP_VOLUME=RV2EFI
ROOT_LABEL=rv2rootfs
