hostname="rv2-freebsd"
# Validated fixed CPU operating point, reapplied by rv2_cpu each boot.
rv2_cpu_enable="YES"
# DHCP on both onboard Ethernet ports; dhclient runs in the background so an
# uncabled port does not stall boot.
ifconfig_smte0="DHCP"
ifconfig_smte1="DHCP"
background_dhclient="YES"
sshd_enable="YES"
ntpd_enable="YES"
ntpd_sync_on_start="YES"
# Grow the root filesystem to fill the card on first boot.
growfs_enable="YES"
dumpdev="NO"
