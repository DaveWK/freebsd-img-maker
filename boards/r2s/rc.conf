hostname="r2s-freebsd"
# DHCP on every port; dhclient runs in the background so an uncabled port
# does not stall boot.
ifconfig_rge0="DHCP"
ifconfig_rge1="DHCP"
ifconfig_smte0="DHCP"
ifconfig_smte1="DHCP"
background_dhclient="YES"
# Fixed validated CPU operating point and board MAC addresses.
r2s_cpu_enable="YES"
smte_macs_enable="YES"
sshd_enable="YES"
# Keep the PMIC RTC synchronized with network time.
ntpd_enable="YES"
ntpd_sync_on_start="YES"
# Grow the root filesystem to fill the eMMC on first boot.
growfs_enable="YES"
dumpdev="NO"
