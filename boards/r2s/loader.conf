# /boot/loader.conf for the OrangePi R2S (SpacemiT K1).
# kern.smp.disabled must never be set here: all eight cores are supported.

# USB device-mode serial console (umodem) on the USB-C port.
hw.usb.template=3
umodem_load="YES"

beastie_disable="YES"
loader_color="NO"
# Space at the countdown drops to the OK prompt, for booting another kernel.
autoboot_delay="10"

# K1 device tree, loaded explicitly by the loader.
k1dtb_load="YES"
k1dtb_name="/boot/dtb/k1-orangepi-r2s.dtb"
k1dtb_type="dtb"

vm.pmap.superpages_enabled="0"

# Maximum tested MTU-1500 SMTE endpoint performance.
hw.smte.0.dma_translate="1"
hw.smte.1.dma_translate="0"
hw.smte.0.sw_lro="1"
hw.smte.0.tx_pack="1"
hw.smte.0.tx_queue_len="1024"
