# OrangePi R2S: SpacemiT K1, 2 GiB, 8 GB eMMC, 2x RTL8125 (rge) + 2x SMTE.
BOARD_NAME="OrangePi R2S"
KERNCONF=R2SPROD
DTB=k1-orangepi-r2s.dtb
# The image is the eMMC user area. bt0 lives in the eMMC boot0 hardware
# partition and the OpenSBI+EDK2 FIT in boot1, outside the image.
MEDIA=emmc
BOOT_CHAIN=r2s
ESP_LABEL=efiboot
ESP_VOLUME=EFISYS
ROOT_LABEL=r2srootfs
