# K1 R2S/RV2 userland only. Host bootstrap tools retain their host architecture.
# Requires the production bsd.cpu.mk RISCV_NO_DEFAULT_MARCH guard.
.if ${MACHINE_ARCH:U} == "riscv64"
RISCV_NO_DEFAULT_MARCH=yes
CFLAGS+= -march=rv64gcv_zba_zbb_zbs -mtune=spacemit-x60
CXXFLAGS+= -march=rv64gcv_zba_zbb_zbs -mtune=spacemit-x60
.endif

# Retain the production computeBestVF workaround until preserved reproducers pass
# the hosted LLVM 22 compiler. The assertion was reproduced with Clang 21.1.8
# while cross-compiling these seven libLLVM translation units for native RISC-V.
# Keep the native ISA, X60 tuning and SLP vectorizer; suppress only their loop
# vectorizer. Revisit after a compiler fix passes all preserved reproducers.
.if ${.CURDIR:M*/lib/clang/libllvm} != "" && ${MACHINE_ARCH:U} == "riscv64"
CXXFLAGS.MemorySSA.cpp+= -fno-vectorize
CXXFLAGS.MemorySSAUpdater.cpp+= -fno-vectorize
CXXFLAGS.InstrRefBasedImpl.cpp+= -fno-vectorize
CXXFLAGS.ADCE.cpp+= -fno-vectorize
CXXFLAGS.GVNHoist.cpp+= -fno-vectorize
CXXFLAGS.PromoteMemoryToRegister.cpp+= -fno-vectorize
CXXFLAGS.SSAUpdaterBulk.cpp+= -fno-vectorize
.endif

# Same reproduced Clang 21.1.8 cost-model failure in native target libclang.
# Preserve RVV/X60 and SLP; host compiler builds and other files are unaffected.
.if ${.CURDIR:M*/lib/clang/libclang} != "" && ${MACHINE_ARCH:U} == "riscv64"
CXXFLAGS.Dominators.cpp+= -fno-vectorize
CXXFLAGS.DebugCheckers.cpp+= -fno-vectorize
CXXFLAGS.BugReporterVisitors.cpp+= -fno-vectorize
.endif
