# Orange Pi R2S / K1: install as /etc/devd/r2s-nomatch.conf
#
# Every device-tree node without a FreeBSD driver (system controllers, cache
# nodes, cpu-map, thermal-zones, aliases, chosen, __symbols__, leds, the pdma
# controller, ...) raises a nomatch event at boot, and the stock
# /etc/devd/devmatch.conf rule (priority 100) runs "service devmatch
# quietstart" for each of them. devd works its queue serially, and each run
# costs about 2.5 s of shell on a 300 MHz core, about 35 s of a 98 s boot,
# with the DHCP interface scripts queued behind them.
#
# Nothing under these buses can be satisfied by a loadable module in the R2S
# kernel (all FDT drivers are compiled in), so consume the events here at a
# higher priority with no action. Events on iicbus / pci / usbus still reach
# devmatch, which is how icee (the EEPROM driver) autoloads.
#
# Match on the whole message rather than on $bus: these nodes have an empty
# location field, and devd (sbin/devd/devd.cc process_event -> set_vars ->
# chop_var) stops parsing at the leading space, so $bus and $name are never
# set for them. Matching $bus therefore works for iicbus/pci events (they
# carry a location) but silently fails for exactly the events this file is
# for. Keep this file free of quote characters inside comments.
nomatch 101 {
	match "_" " +at +.* on (simplebus|ofwbus|cpulist|nexus)[0-9]+";
};
